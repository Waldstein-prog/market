<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meadow Market</title>
  <style>
    :root { --meadow: #6b9b52; --meadow-dark: #4f7a3a; --cream: #f7f9f2; --ink: #2b3a22; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #cfe6b8 0%, transparent 60%),
        linear-gradient(180deg, var(--cream) 0%, #eef3e4 100%);
      min-height: 100%;
      display: flex; flex-direction: column;
    }
    .topbar {
      background: var(--meadow);
      color: #fff;
      padding: .9rem 1.25rem;
      font-weight: 700;
      letter-spacing: .2px;
      box-shadow: 0 2px 8px rgba(79,122,58,.25);
    }
    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e2ead3;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(79,122,58,.12);
      max-width: 460px; width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .flower { font-size: 3.2rem; line-height: 1; }
    h1 { font-size: 1.9rem; margin: .75rem 0 .35rem; color: var(--meadow-dark); }
    .tag {
      display: inline-block;
      margin: .25rem 0 1.25rem;
      padding: .28rem .8rem;
      background: #eaf3dd; color: var(--meadow-dark);
      border-radius: 999px; font-size: .82rem; font-weight: 600;
      letter-spacing: .5px; text-transform: uppercase;
    }
    p { line-height: 1.6; color: #4a5a3d; margin: 0 auto; max-width: 34ch; }
    .foot { margin-top: 1.75rem; font-size: .8rem; color: #8aa07a; }
    a { color: var(--meadow-dark); }
  </style>
</head>
<body>
  <div class="topbar">🌼 Meadow Market</div>
  <main>
    <div class="card">
      <div class="flower">🌼</div>
      <h1>Meadow Market</h1>
      <div class="tag">Binnenkort</div>
      <p>De weide wordt klaargemaakt. Hier opent binnenkort de Meadow Market — munten, marktkraampjes en meer.</p>
      <div class="foot">🌱 Kom later nog eens langs.</div>
    </div>
  </main>
</body>
</html>
