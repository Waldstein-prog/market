<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meadow Market</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <main class="hero">
    <h1>Meadow Market</h1>
    <p class="tagline">{{ROLE_LABEL}} — aan/uit</p>

    <div class="panel">
      <div id="result" class="result" hidden>
        <span id="state" class="badge"></span>
        <button id="toggle" class="toggle"></button>
      </div>
      <p id="msg" class="msg" hidden></p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const PINNED_USER = {{PINNED_USER_JSON}};
    const ROLE_LABEL = {{ROLE_LABEL_JSON}};
    let hasRole = null;

    function showMsg(text, kind) {
      const m = $("msg");
      m.textContent = text;
      m.className = "msg " + (kind || "");
      m.hidden = !text;
    }

    function render() {
      $("result").hidden = hasRole === null;
      if (hasRole === null) return;
      $("state").textContent = hasRole ? ROLE_LABEL + " staat AAN" : ROLE_LABEL + " staat UIT";
      $("state").className = "badge " + (hasRole ? "on" : "off");
      $("toggle").textContent = hasRole ? "Zet uit" : "Zet aan";
      $("toggle").className = "toggle " + (hasRole ? "danger" : "primary");
    }

    async function check() {
      showMsg("", "");
      hasRole = null; render();
      const r = await fetch("/api/status?user_id=" + encodeURIComponent(PINNED_USER));
      const d = await r.json();
      if (!d.ok) { showMsg(d.error, "err"); return; }
      hasRole = d.has_role; render();
    }

    async function toggle() {
      $("toggle").disabled = true;
      const r = await fetch("/api/toggle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: PINNED_USER, enable: !hasRole }),
      });
      const d = await r.json();
      $("toggle").disabled = false;
      if (!d.ok) { showMsg(d.error, "err"); return; }
      hasRole = d.has_role; render();
      showMsg(hasRole ? ROLE_LABEL + " toegekend ✓" : ROLE_LABEL + " verwijderd ✓", "ok");
    }

    $("toggle").addEventListener("click", toggle);
    check();
  </script>
</body>
</html>
