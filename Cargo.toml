[package]
name = "market"
version = "0.1.0"
edition = "2024"
description = "Meadow Market — Discord coin-economy + rol-toggle site (Rust)"

[[bin]]
name = "market"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serenity = "0.12"
poise = "0.6"
rusqlite = { version = "0.36", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
